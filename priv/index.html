<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Priv</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0a0e14;--el:#11161e;--bd:#262d38;--tx:#e8ecf1;--mu:#8b95a5;--ok:#4ade80;--no:#f87171;--am:#f59e0b;--bl:#4f8fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:640px;margin:0 auto}
h1{font-size:18px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:8px}
select,input{flex:1;min-width:0;background:var(--el);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:10px 12px;font-size:13px}
.sum{font-size:12px;color:var(--mu);margin:6px 0 10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--el);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;margin-bottom:6px;cursor:pointer}
.item:active{opacity:.7}
.nm{font-size:13px;font-weight:600}
.dt{font-size:11px;color:var(--mu);margin-top:2px}
.cnt{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.cnt.low{color:var(--no)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.show{display:flex}
.sheet{background:var(--el);border:1px solid var(--bd);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:16px}
.sheet h2{font-size:15px}
.sheet p{font-size:11px;color:var(--mu);margin:2px 0 12px}
.day{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:5px;font-size:13px;cursor:pointer}
.day.h{border-color:rgba(74,222,128,.5)}
.day.m{border-color:rgba(245,158,11,.6)}
.day.a{border-color:rgba(248,113,113,.5)}
.tag{font-size:10px;font-weight:700}
.h .tag{color:var(--ok)}.m .tag{color:var(--am)}.a .tag{color:var(--no)}.e .tag{color:var(--mu)}
button{width:100%;margin-top:8px;padding:11px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:13px;font-weight:600}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--el);border:1px solid var(--bd);border-radius:10px;padding:10px 16px;font-size:12px;display:none;z-index:20}
</style>
</head>
<body>
<h1>Rekap kehadiran bulanan</h1>
<div class="row">
  <select id="bulan" onchange="muat()"></select>
  <select id="urut" onchange="render()">
    <option value="kelas">Urut kelas</option>
    <option value="sedikit">Paling jarang hadir</option>
  </select>
</div>
<div class="row">
  <input id="cari" placeholder="Cari nama..." oninput="render()">
  <select id="fkelas" onchange="render()"><option value="">Semua kelas</option></select>
</div>
<div class="sum" id="sum">Memuat...</div>
<div id="list"></div>

<div id="modal" onclick="if(event.target===this)tutup()">
  <div class="sheet">
    <h2 id="mNama"></h2>
    <p id="mInfo"></p>
    <div class="row">
      <input type="time" id="mJam" step="1" title="Jam sholat sebenarnya (jam:menit:detik)">
      <select id="mAlasan">
        <option>Tidak bawa QR</option>
        <option>Scan gagal</option>
        <option>Lainnya</option>
      </select>
    </div>
    <div class="row">
      <input type="date" id="mTgl">
      <button style="margin:0;width:auto;padding:0 16px" onclick="tambahTgl()">Tambah</button>
    </div>
    <div id="mDays"></div>
    <button onclick="tutup()">Tutup</button>
  </div>
</div>
<div id="toast"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBQwKb5BgWywX3bx3gKjNJsugJ1sUBr4X4",
  authDomain:"absen-dzuhur.firebaseapp.com",
  databaseURL:"https://absen-dzuhur-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"absen-dzuhur",
  storageBucket:"absen-dzuhur.firebasestorage.app",
  messagingSenderId:"254784143918",
  appId:"1:254784143918:web:5d9769d58fced6a0b015bf"
});
const db=firebase.database();
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const fk=d=>d.toLocaleDateString('id-ID').replace(/\//g,'-');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=[],P={},days=[],cur=null,busy=false;

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}

function initBulan(){
  const s=document.getElementById('bulan'),now=new Date();
  for(let i=0;i<12;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    s.innerHTML+=`<option value="${d.getFullYear()}-${d.getMonth()+1}">${d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`;
  }
}

async function muat(){
  document.getElementById('sum').textContent='Memuat...';
  document.getElementById('list').innerHTML='';
  const [y,m]=document.getElementById('bulan').value.split('-').map(Number);
  days=[];
  for(let i=1;i<=new Date(y,m,0).getDate();i++){
    const d=new Date(y,m-1,i);
    if(d.getDay()>=1&&d.getDay()<=5)days.push(d);
  }
  try{
    const [ss,...ps]=await Promise.all([db.ref('siswa').once('value'),...days.map(d=>db.ref('presensi/'+fk(d)).once('value'))]);
    P={};days.forEach((d,i)=>P[fk(d)]=ps[i].val()||{});
    S=[];const s=ss.val()||{};
    for(const k in s)for(const a in s[k])S.push({...s[k][a],kelas:k,absen:a});
    const fkel=document.getElementById('fkelas'),ada=new Set([...fkel.options].map(o=>o.value));
    [...new Set(S.map(x=>x.kelas))].sort().forEach(k=>{if(!ada.has(k))fkel.innerHTML+=`<option value="${esc(k)}">${esc(k)}</option>`});
    render();
  }catch(e){document.getElementById('sum').textContent='Gagal memuat: '+(e.message||e)}
}

const isHadir=h=>h&&h.status!=='TIDAK HADIR';
const hitung=s=>days.filter(d=>isHadir(P[fk(d)][s.kelas+'_'+s.absen])).length;

function render(){
  const q=document.getElementById('cari').value.toLowerCase();
  const kf=document.getElementById('fkelas').value;
  const urut=document.getElementById('urut').value;
  let f=S.filter(x=>(x.nama||'').toLowerCase().includes(q)&&(!kf||x.kelas===kf)).map(x=>({...x,n:hitung(x)}));
  f.sort((a,b)=>urut==='sedikit'?(a.n-b.n||a.kelas.localeCompare(b.kelas)):(a.kelas.localeCompare(b.kelas)||parseInt(a.absen)-parseInt(b.absen)));
  document.getElementById('sum').textContent=`${f.length} siswa • ${days.length} hari sekolah di bulan ini`;
  document.getElementById('list').innerHTML=f.map(x=>`
    <div class="item" onclick="buka('${esc(x.kelas)}','${esc(x.absen)}')">
      <div><div class="nm">${esc(x.nama)}</div><div class="dt">${esc(x.kelas)} • Absen ${esc(x.absen)}</div></div>
      <div class="cnt ${x.n<days.length/2?'low':''}">${x.n}/${days.length}</div>
    </div>`).join('')||'<div class="sum">Tidak ada data</div>';
}

function buka(k,a){
  cur=S.find(x=>x.kelas===k&&String(x.absen)===String(a));
  if(cur){
    const [y,m]=document.getElementById('bulan').value.split('-').map(Number);
    const p2=n=>String(n).padStart(2,'0');
    const t=document.getElementById('mTgl');
    t.min=`${y}-${p2(m)}-01`;t.max=`${y}-${p2(m)}-${p2(new Date(y,m,0).getDate())}`;t.value='';
    renderModal();document.getElementById('modal').classList.add('show')}
}
function tambahTgl(){
  const v=document.getElementById('mTgl').value;
  if(!v){toast('Pilih tanggal dulu');return}
  const [y,m,d]=v.split('-').map(Number);
  const key=fk(new Date(y,m-1,d));
  const i=days.findIndex(x=>fk(x)===key);
  if(i<0){toast('Bukan hari sekolah (Senin-Jumat) di bulan ini');return}
  const h=P[key][cur.kelas+'_'+cur.absen];
  if(h&&h.status!=='TIDAK HADIR'){toast('Sudah tercatat hadir di tanggal itu');return}
  toggle(i);
}
function tutup(){document.getElementById('modal').classList.remove('show');cur=null;render()}

function renderModal(){
  const id=cur.kelas+'_'+cur.absen;
  document.getElementById('mNama').textContent=cur.nama;
  document.getElementById('mInfo').textContent=`${cur.kelas} • Absen ${cur.absen} • Hadir ${hitung(cur)} dari ${days.length} hari. Ketuk tanggal untuk tambah/batalkan.`;
  document.getElementById('mDays').innerHTML=days.map((d,i)=>{
    const h=P[fk(d)][id];
    let c='e',t='Kosong';
    if(h&&h.status==='TIDAK HADIR'){c='a';t='Alpa'}
    else if(h&&h.koreksi){c='m';t='Koreksi '+(h.jam||'')}
    else if(h){c='h';t='Hadir (scan)'}
    return `<div class="day ${c}" onclick="toggle(${i})"><span>${HARI[d.getDay()]}, ${fk(d)}</span><span class="tag">${t}</span></div>`;
  }).join('');
}

async function ubahTotal(n){
  await db.ref(`siswa/${cur.kelas}/${cur.absen}/totalHadir`).transaction(v=>Math.max(0,(v||0)+n));
}
function tsJam(d,jam){
  const [hh,mm,ss]=jam.split(':').map(Number);
  return new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm,ss||0).getTime();
}
function catat(aksi,key,extra){
  db.ref('logPriv').push({ts:Date.now(),aksi,kelas:cur.kelas,absen:cur.absen,nama:cur.nama,tanggal:key,...(extra||{})});
}

async function toggle(i){
  if(busy)return;
  const d=days[i],key=fk(d),id=cur.kelas+'_'+cur.absen,h=P[key][id];
  if(h&&h.status!=='TIDAK HADIR'&&!h.koreksi){toast('Ini hasil scan asli, tidak bisa diubah');return}
  const hapus=h&&h.koreksi&&h.status!=='TIDAK HADIR';
  const jamRaw=document.getElementById('mJam').value;
  const jam=jamRaw.length===5?jamRaw+':00':jamRaw;
  const alasan=document.getElementById('mAlasan').value;
  if(!hapus&&!jam){toast('Isi jam sholat sebenarnya dulu');return}
  busy=true;
  try{
    const ref=db.ref(`presensi/${key}/${id}`);
    if(hapus){
      await ref.remove();await ubahTotal(-1);catat('hapus_manual',key);
      delete P[key][id];
    }else{
      const isl=String(cur.agama||'').trim().toLowerCase()==='islam';
      const o={nama:cur.nama,kelas:cur.kelas,absen:cur.absen,jk:cur.jk||'',agama:cur.agama||'',jam:jam,status:isl?'DZUHUR':'IBADAH',totalHadir:(cur.totalHadir||0)+1,timestamp:tsJam(d,jam),koreksi:true,alasan};
      await ref.set(o);await ubahTotal(1);catat('tambah_manual',key,{jam,alasan});
      P[key][id]=o;
    }
    renderModal();
  }catch(e){toast('Gagal: '+(e.message||e))}
  busy=false;
}

initBulan();muat();
</script>
</body>
</html>
